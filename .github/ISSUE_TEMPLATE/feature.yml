name: Feature request
description: Suggest an improvement, such as support for another tool's credential store.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could keys-sync solve it? For a new store, describe its file location and format with placeholder values; never paste a real key.
    validations:
      required: true
